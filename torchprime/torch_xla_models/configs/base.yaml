# This defines the order in which configs are loaded. The latter configs
# override the earlier ones.
defaults:
  - _self_ # refers to this config file
  - model: mixtral-8x7b # refers to model/llama.yaml

dataset_name: wikitext
dataset_config_name: wikitext-2-raw-v1
global_batch_size: 8
logging_steps: 10
max_steps: 15
block_size: 4096
cache_dir: /tmp/
seed: 42
profile_step: -1
profile_logdir: /tmp/profile
profile_duration: 100000
optimizer:
  learning_rate: 5.e-5
lr_scheduler:
  type: linear
  warmup_steps: 0
mesh:
  dcn: 1
  fsdp: 4
  tensor: 1
  expert: 1